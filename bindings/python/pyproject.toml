[build-system]
requires = ["setuptools>=77.0.0", "packaging"]
build-backend = "setuptools.build_meta"

[project]
name = "gpiod"
dynamic = ["version"]
description = "Python bindings for libgpiod"
readme = "README.md"
license = "LGPL-2.1-or-later"
requires-python = ">=3.10"
authors = [
  {name = "Bartosz Golaszewski", email = "brgl@bgdev.pl"},
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Operating System :: POSIX :: Linux",
  "Typing :: Typed",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading :: 3 - Stable",
]

[project.urls]
Homepage = "https://git.kernel.org/pub/scm/libs/libgpiod/libgpiod.git"
Issues = "https://github.com/brgl/libgpiod/issues/"
Changelog = "https://github.com/brgl/libgpiod/blob/master/bindings/python/CHANGELOG.md"

[dependency-groups]
lint = ["mypy>=1.18.1", "ruff~=0.17.0", "types-setuptools", "packaging"]

[tool.setuptools]
platforms = ["linux"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "gpiod.version.__version__"}

[tool.setuptools.packages.find]
include = ["gpiod"]
namespaces = false

[tool.mypy]
python_version = "3.10"
exclude_gitignore = true
files = [
  ".",
]

[tool.ruff]
extend-exclude = ["*.md"]

[tool.ruff.lint]
typing-extensions = false

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["F841", "SIM117"]  # ignore warnings about unused variables and chaining context managers

[tool.cibuildwheel]
build = "cp*"
archs = ["x86_64", "aarch64"]
